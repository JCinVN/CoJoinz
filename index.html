<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoJoinz Hub</title>

  <!-- PWA Manifest & Theme Color -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #121212;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* 頂部 Logo */
    .logo-container {
      width: 100%;
      max-width: 400px;
      margin-bottom: 30px;
      text-align: center;
    }

    .logo-img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* 卡片容器：電腦排版 */
    .cards-container {
      display: flex;
      flex-direction: row;
      gap: 20px;
      justify-content: center;
      align-items: center;
      max-width: 1100px;
      width: 100%;
    }

    /* 卡片項目 */
    .card-item {
      display: block;
      flex: 1;
      max-width: 320px;
      transition: transform 0.2s ease;
      text-decoration: none;
    }

    .card-item img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 28px;
    }

    .card-item:hover {
      transform: translateY(-6px);
    }

    .card-item:active {
      transform: translateY(2px);
    }

    /* 手機版 RWD：垂直疊放 */
    @media (max-width: 768px) {
      .logo-container {
        max-width: 280px;
        margin-bottom: 25px;
      }

      .cards-container {
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      .card-item {
        width: 100%;
        max-width: 320px;
      }
    }

    /* 離線 Banner */
    #offline-banner {
      display: none;
      position: fixed;
      top: 12px;
      background: #EF4444;
      color: #FFF;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      z-index: 999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div id="offline-banner">⚠️ 目前為離線模式</div>

  <!-- 頂部 Logo -->
  <div class="logo-container">
    <img src="./logo.png" alt="CoJoinz Logo" class="logo-img">
  </div>

  <!-- 卡片區域 -->
  <div class="cards-container">
    <!-- 1. SCORZ (另開新分頁) -->
    <a href="https://jcinvn.github.io/CoJoinz-Scorz/" target="_blank" rel="noopener noreferrer" class="card-item">
      <img src="./scorz.png" alt="CoJoinz SCORZ">
    </a>

    <!-- 2. WORDSCANZ (另開新分頁) -->
    <a href="https://jcinvn.github.io/CoJoinz-WordScanz/" target="_blank" rel="noopener noreferrer" class="card-item">
      <img src="./wordscanz.png" alt="CoJoinz WORDSCANZ">
    </a>

    <!-- 3. INFOZ (Coming Soon) -->
    <a href="javascript:void(0);" onclick="alert('INFOZ is Coming Soon!')" class="card-item">
      <img src="./infoz.png" alt="CoJoinz INFOZ">
    </a>
  </div>

  <script>
    // 註冊 Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('SW Registered'))
          .catch(err => console.log('SW Register Failed:', err));
      });
    }

    // 網路狀態偵測
    function updateOnlineStatus() {
      const banner = document.getElementById('offline-banner');
      banner.style.display = navigator.onLine ? 'none' : 'block';
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>
</body>
</html>
