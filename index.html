<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CoJoinz Hub</title>

  <!-- PWA Manifest & Theme Color -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent; /* 移除手機點擊灰色陰影 */
    }

    body {
      background-color: #121212;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* 頂部 Logo 容器 */
    .logo-container {
      width: 100%;
      max-width: 400px;
      margin-bottom: 30px;
      text-align: center;
    }

    .logo-img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* 卡片容器：電腦版橫排 */
    .cards-container {
      display: flex;
      flex-direction: row;
      gap: 20px;
      justify-content: center;
      align-items: center;
      max-width: 1100px;
      width: 100%;
    }

    /* 卡片可點擊區域 */
    .card-item {
      display: block;
      flex: 1;
      max-width: 320px;
      cursor: pointer;
      transition: transform 0.2s ease;
      text-decoration: none;
    }

    .card-item img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 28px;
      pointer-events: none; /* 防止手機長按選取圖片 */
    }

    .card-item:hover {
      transform: translateY(-6px);
    }

    .card-item:active {
      transform: translateY(2px);
    }

    /* 手機版 RWD：三個卡片由上到下垂直疊放 */
    @media (max-width: 768px) {
      .logo-container {
        max-width: 280px;
        margin-bottom: 25px;
      }

      .cards-container {
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      .card-item {
        width: 100%;
        max-width: 320px;
      }
    }

    /* 離線提示 Banner */
    #offline-banner {
      display: none;
      position: fixed;
      top: 12px;
      background: #EF4444;
      color: #FFF;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      z-index: 999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div id="offline-banner">⚠️ 目前為離線模式</div>

  <!-- 頂部 Logo 圖檔 -->
  <div class="logo-container">
    <img src="logo.jpg" alt="CoJoinz Logo" class="logo-img">
  </div>

  <!-- 三張卡片容器 -->
  <div class="cards-container">
    <!-- 1. SCORZ (保持原視窗，另開新頁面) -->
    <a href="https://jcinvn.github.io/CoJoinz-Scorz/" target="_blank" rel="noopener" class="card-item" onclick="openNewTab(event, 'https://jcinvn.github.io/CoJoinz-Scorz/')">
      <img src="scorz.jpg" alt="CoJoinz SCORZ">
    </a>

    <!-- 2. WORDSCANZ (保持原視窗，另開新頁面) -->
    <a href="https://jcinvn.github.io/CoJoinz-WordScanz/" target="_blank" rel="noopener" class="card-item" onclick="openNewTab(event, 'https://jcinvn.github.io/CoJoinz-WordScanz/')">
      <img src="wordscanz.jpg" alt="CoJoinz WORDSCANZ">
    </a>

    <!-- 3. INFOZ (Coming Soon 提示) -->
    <a href="javascript:void(0);" class="card-item" onclick="showComingSoon(event)">
      <img src="infoz.jpg" alt="CoJoinz INFOZ">
    </a>
  </div>

  <script>
    // 強制保持原視窗並另開新視窗/分頁
    function openNewTab(event, url) {
      event.preventDefault();
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    // 點擊 INFOZ 彈出 Coming Soon
    function showComingSoon(event) {
      event.preventDefault();
      alert('Coming Soon!');
    }

    // 註冊 PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('SW 註冊成功'))
          .catch(err => console.log('SW 註冊失敗:', err));
      });
    }

    // 離線狀態偵測
    function updateOnlineStatus() {
      const banner = document.getElementById('offline-banner');
      banner.style.display = navigator.onLine ? 'none' : 'block';
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>
</body>
</html>
